name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o XG99Translator.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'APK
        working-directory: XG99Translator
        run: |
          gradle wrapper --gradle-version 8.10.2 --no-daemon
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: XG99-Traducteur-APK
          path: XG99Translator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
